name: Football Scoring Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scoring-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run diagnostics
        continue-on-error: true
        run: python -m simulator.diagnostics > diagnostics.log 2>&1
      - name: Run controlled sweeps
        continue-on-error: true
        run: python -m simulator.sweeps > sweeps.log 2>&1
      - name: Run regression suite
        continue-on-error: true
        run: |
          set +e
          python -m simulator.runner > regression.log 2>&1
          rc=$?
          echo "$rc" > regression-exit-code.txt
          exit "$rc"
      - name: Run production integration tests
        run: python -m pytest tests/test_production_integration.py
      - name: Print scoring lab reports
        if: always()
        run: |
          for f in diagnostics.log sweeps.log regression.log regression-exit-code.txt diagnostic-report.json sweep-report.json regression-report.json; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              cat "$f"
            else
              echo "===== $f: MISSING ====="
            fi
          done
      - name: Persist latest report for inspection
        if: always()
        continue-on-error: true
        run: |
          mkdir -p lab
          for f in diagnostics.log sweeps.log regression.log regression-exit-code.txt diagnostic-report.json sweep-report.json regression-report.json; do
            if [ -f "$f" ]; then cp "$f" "lab/$f"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab
          git commit -m "chore: update scoring lab report [skip ci]" || true
          git push origin HEAD:main || true
      - name: Upload scoring lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoring-lab-reports
          if-no-files-found: warn
          path: |
            diagnostics.log
            sweeps.log
            regression.log
            regression-exit-code.txt
            diagnostic-report.json
            sweep-report.json
            regression-report.json
            lab/diagnostics.log
            lab/sweeps.log
            lab/regression.log
            lab/regression-exit-code.txt
            lab/diagnostic-report.json
            lab/sweep-report.json
            lab/regression-report.json
      - name: Enforce regression result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("regression-report.json")
          if not p.exists():
              raise SystemExit("regression-report.json was not produced")
          report = json.loads(p.read_text())
          summary = report["summary"]
          print(f"Regression status: {summary['status']} — {summary['passed']}/{summary['total_tests']} passed")
          if summary["status"] != "PASS":
              raise SystemExit(1)
          PY
